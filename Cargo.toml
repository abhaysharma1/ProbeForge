[workspace]
members = [
    "crates/contracts",
    "services/api",
    "services/scheduler",
    "services/execution-worker",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
argon2 = "0.5.3"
axum = "0.8.9"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
cookie = "0.18.2"
getrandom = "0.3.4"
probeforge-contracts = { path = "crates/contracts" }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio", "uuid"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7.1", features = ["limit", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["serde", "v4"] }
zeroize = "1.9.1"
